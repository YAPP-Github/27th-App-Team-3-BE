version: 0.0
os: linux

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 180
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 150
      runas: root
