name: Review / Issue Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      # ✅ Issue: opener를 assignee로
      - name: Assign issue author
        if: ${{ github.event_name == 'issues' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.actor],
            })

      # ✅ PR: author를 assignee로 (+ draft 해제 시점에도 적용)
      - name: Assign PR author / reviewers
        if: ${{ github.event_name == 'pull_request' }}
        uses: hkusu/review-assign-action@v1
        with:
          assignees: ${{ github.actor }} # PR 작성자 assignee
          # reviewers: foo, bar  # 필요하면 추가 (draft면 ready_for_review 때 지정됨)
