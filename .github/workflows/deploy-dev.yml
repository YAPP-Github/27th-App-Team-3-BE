name: CD - Deploy to Dev Environment

on:
  workflow_run:
    workflows: ["CI - Test and Build"]
    types:
      - completed
    branches:
      - dev

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: teamtwix-dev
  S3_BUCKET: teamtwix-dev-static
  CODEDEPLOY_APP: teamtwix-dev-app
  CODEDEPLOY_GROUP: teamtwix-dev-deployment-group

concurrency:
  group: deployment-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Update submodule to latest
        run: |
          git submodule update --remote
          git submodule status

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew :bootstrap:bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create deployment bundle
        run: |
          mkdir -p deployment_bundle
          cp appspec.yml deployment_bundle/
          cp -r scripts deployment_bundle/
          chmod +x deployment_bundle/scripts/*.sh
          cd deployment_bundle
          zip -r ../deployment.zip .

      - name: Upload deployment bundle to S3
        run: |
          aws s3 cp deployment.zip \
            s3://${{ env.S3_BUCKET }}/deployments/deployment-${{ github.sha }}.zip

      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ env.CODEDEPLOY_GROUP }} \
            --s3-location bucket=${{ env.S3_BUCKET }},bundleType=zip,key=deployments/deployment-${{ github.sha }}.zip \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --description "Deploy ${{ github.sha }}" \
            --region ${{ env.AWS_REGION }} \
            --query deploymentId \
            --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "Deployment ID: $DEPLOYMENT_ID"

      - name: Wait for deployment to complete
        run: |
          aws deploy wait deployment-successful \
            --deployment-id ${{ steps.deploy.outputs.deployment_id }} \
            --region ${{ env.AWS_REGION }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "Deployment Successful!"
          echo "Image: ${{ steps.build-image.outputs.image }}"
          echo "Deployment ID: ${{ steps.deploy.outputs.deployment_id }}"